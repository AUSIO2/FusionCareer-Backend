# Java 机：MySQL + 已导入的 backend 镜像（不在机上 mvn/docker build 业务镜像）
# 镜像由本机构建: docker build -f fusioncareer-biz/Dockerfile.prod -t fusioncareer-backend:prod fusioncareer-biz
# 启动: docker compose -f deploy/docker-compose.java.image.yml --env-file .env.production up -d

services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: fusioncareer
      TZ: Asia/Shanghai
    volumes:
      - mysql_data:/var/lib/mysql
      - ../fusioncareer-biz/src/main/resources/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    image: fusioncareer-backend:prod
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_URL: jdbc:mysql://mysql:3306/fusioncareer?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&allowMultiQueries=true
      DB_USERNAME: root
      DB_PASSWORD: ${DB_PASSWORD}
      FUDAN_SSO_CLIENT_ID: ${FUDAN_SSO_CLIENT_ID}
      FUDAN_SSO_CLIENT_SECRET: ${FUDAN_SSO_CLIENT_SECRET}
      FUDAN_SSO_FRONTEND_REDIRECT_URL: ${FUDAN_SSO_FRONTEND_REDIRECT_URL:-https://fusioncareer.fudan.edu.cn/}
      PYTHON_SERVICE_BASE_URL: ${PYTHON_SERVICE_BASE_URL}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN}
    ports:
      - "9100:9100"
    volumes:
      - upload_data:/data/fusioncareer/uploads

volumes:
  mysql_data:
  upload_data:

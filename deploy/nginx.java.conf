# 已废弃：域名在 Python 机时请使用 deploy/nginx.python.conf
# 本文件仅适用于「域名绑在 Java 机」的单网关方案

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;
    client_max_body_size 20M;

    upstream java_backend {
        server backend:9100;
    }

    # Python 机内网地址（双机部署时修改此处）
    upstream python_agent {
        server 10.107.13.184:8900;
    }

    server {
        listen 80;
        server_name fusioncareer.fudan.edu.cn;

        # ==== SSL（生产建议启用，见 deploy/DEPLOY-DUAL.md）====
        # listen 443 ssl;
        # ssl_certificate     /etc/nginx/ssl/fullchain.pem;
        # ssl_certificate_key /etc/nginx/ssl/privkey.pem;
        # ssl_protocols       TLSv1.2 TLSv1.3;

        location / {
            root /usr/share/nginx/html;
            index index.html;
            try_files $uri $uri/ /index.html;
        }

        location ^~ /api/internal/ {
            return 404;
        }

        location /api/ {
            proxy_pass http://java_backend/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /fudan/ {
            proxy_pass http://java_backend/fudan/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /agent/ {
            proxy_pass http://python_agent/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 300s;
        }

        location /files/ {
            alias /data/fusioncareer/uploads/;
        }
    }
}

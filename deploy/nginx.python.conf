# Python 机网关 Nginx — 域名 fusioncareer.fudan.edu.cn 绑在本机
# SSO / API /files 反代到 Java 机；/agent 走本机 Agent

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;
    client_max_body_size 20M;

    # Java 机内网（fusioncareer-1-1）
    upstream java_backend {
        server 172.22.130.216:9100;
    }

    upstream python_agent {
        server agent:8900;
    }

    server {
        listen 80;
        server_name fusioncareer.fudan.edu.cn;

        # ==== SSL（生产必须，见 DEPLOY-DUAL.md）====
        # listen 443 ssl;
        # ssl_certificate     /etc/nginx/ssl/fullchain.pem;
        # ssl_certificate_key /etc/nginx/ssl/privkey.pem;
        # ssl_protocols       TLSv1.2 TLSv1.3;

        # 前端 / 登录落地页（有独立前端容器时可改 proxy_pass）
        location / {
            root /usr/share/nginx/html;
            index index.html;
            try_files $uri $uri/ /index.html;
        }

        location ^~ /api/internal/ {
            return 404;
        }

        # 业务 API → Java
        location /api/ {
            proxy_pass http://java_backend/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 复旦 SSO（逻辑在 Java，对外 URL 在本域名）→ Java
        location /fudan/ {
            proxy_pass http://java_backend/fudan/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 上传文件（存储在 Java 机）→ Java
        location /files/ {
            proxy_pass http://java_backend/files/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # AI Agent → 本机
        location /agent/ {
            proxy_pass http://python_agent/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 300s;
        }
    }
}

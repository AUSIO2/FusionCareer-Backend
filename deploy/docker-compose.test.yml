name: fusioncareer-test

services:
  mysql-test:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: fusioncareer_test
      MYSQL_DATABASE: fusioncareer_test
      TZ: Asia/Shanghai
    ports:
      - "127.0.0.1:13306:3306"
    volumes:
      - mysql_test_data:/var/lib/mysql
      - ../fusioncareer-biz/src/main/resources/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-pfusioncareer_test"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  mysql_test_data:

# FusionCareer — Java 机（仅 MySQL + Backend，无 Nginx）
# 对外流量由 Python 机 Nginx 反代；9100 仅对 Python 机内网开放
#
# 启动: docker compose -f deploy/docker-compose.java.yml --env-file .env.production up -d --build

services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: fusioncareer
      TZ: Asia/Shanghai
    volumes:
      - mysql_data:/var/lib/mysql
      - ../fusioncareer-biz/src/main/resources/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_URL: jdbc:mysql://mysql:3306/fusioncareer?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&allowMultiQueries=true
      DB_USERNAME: root
      DB_PASSWORD: ${DB_PASSWORD}
      FUDAN_SSO_CLIENT_ID: ${FUDAN_SSO_CLIENT_ID}
      FUDAN_SSO_CLIENT_SECRET: ${FUDAN_SSO_CLIENT_SECRET}
      FUDAN_SSO_FRONTEND_REDIRECT_URL: ${FUDAN_SSO_FRONTEND_REDIRECT_URL:-https://fusioncareer.fudan.edu.cn/}
      PYTHON_SERVICE_BASE_URL: ${PYTHON_SERVICE_BASE_URL}
    ports:
      # 供 Python 机 Nginx 内网访问；安全组仅放行 10.107.13.184
      - "9100:9100"
    volumes:
      - upload_data:/data/fusioncareer/uploads

volumes:
  mysql_data:
  upload_data:

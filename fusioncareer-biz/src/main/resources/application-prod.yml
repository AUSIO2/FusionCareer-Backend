# =============================================
# FusionCareer Backend — 生产环境配置
# 激活方式: --spring.profiles.active=prod
# =============================================

server:
  port: 9100

spring:
  datasource:
    # 生产环境数据库，通过环境变量注入
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3306/fusioncareer?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&allowMultiQueries=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}

# ===== 复旦 SSO 统一身份认证 =====
# client-id / client-secret 通过环境变量注入，禁止硬编码
fudan-sso:
  mock-login: false
  client-id: ${FUDAN_SSO_CLIENT_ID}
  client-secret: ${FUDAN_SSO_CLIENT_SECRET}
  redirect-uri: ${FUDAN_SSO_REDIRECT_URI:https://fusioncareer.fudan.edu.cn/fudan/callback}
  # 须为站点根路径，勿填 /user（会与业务 API 路径混淆，导致落地为 /user#/login）
  frontend-redirect-url: ${FUDAN_SSO_FRONTEND_REDIRECT_URL:https://fusioncareer.fudan.edu.cn/}

# ===== 文件上传（生产路径） =====
upload:
  base-dir: /data/fusioncareer/uploads
  url-prefix: https://fusioncareer.fudan.edu.cn/files

# ===== AI Agent 服务（双机部署时通过环境变量指向 Python 机内网 IP） =====
python-service:
  base-url: ${PYTHON_SERVICE_BASE_URL:http://127.0.0.1:8900}

internal-service:
  token: ${INTERNAL_SERVICE_TOKEN}

# ===== 关闭 SQL 日志 =====
mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl

server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: fusioncareer-backend
  datasource:
    # Please replace the database name, username and password with actual values
    url: jdbc:mysql://127.0.0.1:3306/fusioncareer?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&allowMultiQueries=true
    username: root
    password: password
    driver-class-name: com.mysql.cj.jdbc.Driver

mybatis-plus:
  mapper-locations: classpath:mapper/**/*.xml
  type-aliases-package: com.fusioncareer.model.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
      id-type: assign_id

# ===== Sa-Token 配置 =====
sa-token:
  # Token 名称（同时也是 Cookie 和 Header 中的 key）
  token-name: Fusion-Token
  # Token 有效期（单位：秒），30天 = 2592000
  timeout: 2592000
  # Token 临时有效期 [指定时间内无操作就视为过期]（单位：秒），-1 代表不限制
  active-timeout: -1
  # 是否允许同一账号多地同时登录（true: 允许, false: 新登录挤掉旧登录）
  is-concurrent: true
  # 在多人登录同一账号时，是否共用一个 Token
  is-share: true
  # Token 风格
  token-style: uuid
  # 是否输出操作日志
  is-log: true

# ===== AI 算法服务配置 =====
python-service:
  # Python 端 FastAPI 的基础 URL
  base-url: http://127.0.0.1:8000
  # 连接超时时间（毫秒）
  connect-timeout: 5000
  # 读取超时时间（毫秒），算法可能较慢，默认 60 秒
  read-timeout: 60000

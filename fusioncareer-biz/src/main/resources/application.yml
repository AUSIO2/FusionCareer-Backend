server:
  port: 9100
  servlet:
    context-path: /

spring:
  application:
    name: fusioncareer-backend
  datasource:
    # Please replace the database name, username and password with actual values
    url: jdbc:mysql://127.0.0.1:3306/fusioncareer?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&allowMultiQueries=true
    username: root
    password: 
    driver-class-name: com.mysql.cj.jdbc.Driver
  servlet:
    multipart:
      # 单个文件最大 20MB
      max-file-size: 20MB
      # 单次请求总大小最大 20MB
      max-request-size: 20MB

mybatis-plus:
  mapper-locations: classpath:mapper/**/*.xml
  type-aliases-package: com.fusioncareer.entity
  type-enums-package: com.fusioncareer.enums
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: assign_id

# ===== Sa-Token 配置 =====
sa-token:
  # Token 名称（同时也是 Cookie 和 Header 中的 key）
  token-name: Fusion-Token
  # Token 有效期（单位：秒），30天 = 2592000
  timeout: 2592000
  # Token 临时有效期 [指定时间内无操作就视为过期]（单位：秒），-1 代表不限制
  active-timeout: -1
  # 是否允许同一账号多地同时登录（true: 允许, false: 新登录挤掉旧登录）
  is-concurrent: true
  # 在多人登录同一账号时，是否共用一个 Token
  is-share: true
  # Token 风格
  token-style: uuid
  # 是否输出操作日志
  is-log: true

# ===== AI 算法服务配置 =====
python-service:
  # Python 端 FastAPI 的基础 URL
  base-url: http://127.0.0.1:8000
  # 连接超时时间（毫秒）
  connect-timeout: 5000
  # 读取超时时间（毫秒），算法可能较慢，默认 60 秒
  read-timeout: 60000

# ===== 复旦 SSO 统一身份认证配置 =====
# 【接入必读：向复旦信息化中心申请注册清单】
# 1. 业务系统服务器公网 IP（必填）：后端服务器的出口 IP，用于加入复旦防火墙白名单，以便本系统能成功发起 HTTP 请求获取 Token 和 UserInfo。
# 2. 授权可信域名（必填）：需要与下方 redirect-uri 使用的域名保持完全一致（例：https://fusioncareer.fudan.edu.cn）。
# 3. 被动注销回调地址（服务端注销）：请将本系统的 SLO 接口提供给复旦（例：https://fusioncareer.fudan.edu.cn/fudan/slo）。
# ⚠️ client-id / client-secret 通过环境变量注入，禁止硬编码到代码仓库中
fudan-sso:
  client-id: ${FUDAN_SSO_CLIENT_ID:your_client_id_here}
  client-secret: ${FUDAN_SSO_CLIENT_SECRET:your_client_secret_here}
  # 务必与注册给复旦的可信域名保持一致，须填写完整的绝对地址
  redirect-uri: https://fusioncareer.fudan.edu.cn/fudan/callback
  # 登录成功或注销后跳转回前端的页面地址
  frontend-redirect-url: https://fusioncareer.fudan.edu.cn/


# ===== 文件上传配置 =====
upload:
  # 文件存储根目录（绝对路径，生产环境按需修改）
  base-dir: /data/fusioncareer/uploads
  # 静态资源访问 URL 前缀（需与 WebConfig 中映射路径一致）
  url-prefix: http://localhost:8080/files
  # 每用户简历文件存储配额：30MB = 31457280 字节
  quota-per-user: 31457280
  # 单个文件大小上限：20MB = 20971520 字节
  max-single-file-bytes: 20971520
  # 允许上传的 MIME 类型白名单
  allowed-mime-types:
    - application/pdf
    - image/jpeg
    - image/png
  # 允许上传的文件扩展名白名单（小写）
  allowed-extensions:
    - pdf
    - jpg
    - jpeg
    - png

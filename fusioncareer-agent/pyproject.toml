[project]
name = "fusioncareer-agent"
version = "0.1.0"
description = "FusionCareer AI Agent — 节点式工作流微服务"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "openai>=1.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pdfplumber>=0.11",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
]

[tool.ruff]
line-length = 120

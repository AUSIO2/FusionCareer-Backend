[project]
name = "fusioncareer-agent"
version = "0.1.0"
description = "FusionCareer AI Agent — 节点式工作流微服务"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "openai>=1.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pdfplumber>=0.11",
    "python-dotenv>=1.0",
    "jsonschema>=4.0",
    "apscheduler>=3.10",
    "requests>=2.31",
    "python-docx>=1.1",
    "lxml>=5.0",
    "Pillow>=10.2",
    "numpy>=1.24",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["runtime*", "tests*"]

[tool.ruff]
line-length = 120

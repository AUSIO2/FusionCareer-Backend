# FusionCareer 全栈部署
# 启动: docker compose --env-file .env.production up -d

services:
  # ── MySQL 数据库 ──
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: fusioncareer
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./fusioncareer-biz/src/main/resources/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Java 后端 ──
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_URL: jdbc:mysql://mysql:3306/fusioncareer?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&allowMultiQueries=true
      DB_USERNAME: root
      DB_PASSWORD: ${DB_PASSWORD}
      FUDAN_SSO_CLIENT_ID: ${FUDAN_SSO_CLIENT_ID}
      FUDAN_SSO_CLIENT_SECRET: ${FUDAN_SSO_CLIENT_SECRET}
      PYTHON_SERVICE_BASE_URL: http://agent:8900
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN}
      USER_CHANGE_KEY: ${USER_CHANGE_KEY}
      USER_CHANGE_KEY_VERSION: ${USER_CHANGE_KEY_VERSION:-1}
      USER_CHANGE_KEYS: ${USER_CHANGE_KEYS:-}
      AGENT_CONTEXT_SECRET: ${AGENT_CONTEXT_SECRET}
      AI_CHAT_RECOMMEND_ENABLED: ${AI_CHAT_RECOMMEND_ENABLED:-true}
      AGENT_CONTEXT_TTL_SECONDS: ${AGENT_CONTEXT_TTL_SECONDS:-300}
      AI_CHAT_UPSTREAM_TIMEOUT_SECONDS: ${AI_CHAT_UPSTREAM_TIMEOUT_SECONDS:-180}
      AI_CHAT_STREAM_TIMEOUT_MS: ${AI_CHAT_STREAM_TIMEOUT_MS:-200000}
      AI_CHAT_RUN_LEASE_SECONDS: ${AI_CHAT_RUN_LEASE_SECONDS:-240}
      PYTHON_SERVICE_READ_TIMEOUT_MS: ${PYTHON_SERVICE_READ_TIMEOUT_MS:-60000}
      AI_CHAT_WRITE_ENABLED: ${AI_CHAT_WRITE_ENABLED:-false}
    ports:
      - "9100:9100"
    volumes:
      - upload_data:/data/fusioncareer/uploads

  # ── Python AI Agent ──
  agent:
    build:
      context: ./fusioncareer-agent
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      BACKEND_BASE_URL: http://backend:9100
      AI_CHAT_RECOMMEND_ENABLED: ${AI_CHAT_RECOMMEND_ENABLED:-true}
      LLM_BASE_URL: ${LLM_BASE_URL}
      LLM_API_KEY: ${LLM_API_KEY}
      LLM_MODEL: ${LLM_MODEL:-gpt-4o-mini}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN}
      AI_CHAT_WRITE_ENABLED: ${AI_CHAT_WRITE_ENABLED:-false}
      AI_CHAT_RUN_TIMEOUT_SECONDS: ${AI_CHAT_RUN_TIMEOUT_SECONDS:-120}
      AI_CHAT_READ_TOOL_TIMEOUT_SECONDS: ${AI_CHAT_READ_TOOL_TIMEOUT_SECONDS:-3}
      AI_CHAT_WRITE_TOOL_TIMEOUT_SECONDS: ${AI_CHAT_WRITE_TOOL_TIMEOUT_SECONDS:-15}
      AI_CHAT_PARSE_TIMEOUT_SECONDS: ${AI_CHAT_PARSE_TIMEOUT_SECONDS:-90}
      AI_CHAT_RECOMMEND_TIMEOUT_SECONDS: ${AI_CHAT_RECOMMEND_TIMEOUT_SECONDS:-30}
      AI_CHAT_MAX_CONCURRENCY: ${AI_CHAT_MAX_CONCURRENCY:-16}
      AI_CHAT_TOOL_TIMEOUTS: '${AI_CHAT_TOOL_TIMEOUTS:-}'
      RECOMMENDATION_LLM_ENABLED: ${RECOMMENDATION_LLM_ENABLED:-true}
      RECOMMENDATION_LLM_TIMEOUT_SECONDS: ${RECOMMENDATION_LLM_TIMEOUT_SECONDS:-15}
      RECOMMENDATION_COMPANY_SCORE_ENABLED: ${RECOMMENDATION_COMPANY_SCORE_ENABLED:-false}
      RECOMMENDATION_AUDIT_LOG_ENABLED: ${RECOMMENDATION_AUDIT_LOG_ENABLED:-false}
      PREFILTER_ENABLED: ${PREFILTER_ENABLED:-true}
      PREFILTER_MIN_HITS: ${PREFILTER_MIN_HITS:-1}
      AGENT_PORT: 8900
    ports:
      - "8900:8900"

  # ── Nginx 反向代理 ──
  nginx:
    image: nginx:alpine
    restart: unless-stopped
    depends_on:
      - backend
      - agent
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/nginx.conf:ro
      - upload_data:/data/fusioncareer/uploads:ro
      # SSL 证书（部署时取消注释）
      # - ./deploy/ssl:/etc/nginx/ssl:ro

volumes:
  mysql_data:
  upload_data:
